<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="FML — ForMyLife">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9c9"/>
      <stop offset=".55" stop-color="#ffc07f"/>
      <stop offset="1" stop-color="#ff8741"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9a45"/>
      <stop offset="1" stop-color="#ef5b1c"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8e9"/>
      <stop offset="1" stop-color="#ffd7a4"/>
    </linearGradient>
    <linearGradient id="char" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5e2b18"/>
      <stop offset="1" stop-color="#20100b"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#f43f0e"/>
      <stop offset=".55" stop-color="#ff7a1a"/>
      <stop offset="1" stop-color="#ffd23f"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe97a"/>
      <stop offset="1" stop-color="#ffb347"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="74" cy="78" r="92" fill="#fff4da" opacity=".38"/>
  <circle cx="454" cy="430" r="104" fill="#ff6b35" opacity=".22"/>

  <!-- burning reflection: body on top, roof at the bottom -->
  <g opacity=".98">
    <rect x="150" y="346" width="212" height="84" rx="18" fill="url(#char)"/>
    <path d="M144 422 256 496 368 422 342 422 256 466 170 422Z" fill="#7c240d"/>
    <path d="M176 392l18 16-12 12 22 14M306 382l-16 20 14 10-22 16" fill="none" stroke="#ff8a3d" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse cx="188" cy="398" rx="8" ry="5" fill="#ff9d45"/>
    <ellipse cx="316" cy="408" rx="8" ry="5" fill="#ff9d45"/>
    <rect x="238" y="346" width="36" height="28" rx="7" fill="#120807"/>
  </g>

  <!-- flames licking the upside-down roof -->
  <g fill="url(#flame)">
    <path d="M132 446c10-24 4-38-8-58 22 14 34 34 28 58 10-8 14-18 12-30 14 14 18 32 10 48-10 20-32 18-42-18Z"/>
    <path d="M226 480c12-28 6-44-8-66 24 16 38 40 32 66 9-9 14-20 12-34 16 16 20 36 12 54-12 22-36 20-48-20Z"/>
    <path d="M330 478c10-24 4-38-8-58 22 14 34 34 28 58 10-8 14-18 12-30 14 14 18 32 10 48-10 20-32 18-42-18Z"/>
    <path d="M390 438c8-18 4-28-6-42 16 10 26 24 22 42 8-6 12-14 10-24 12 12 14 26 8 38-8 16-26 12-34-14Z"/>
  </g>

  <!-- burning coin in the reflection -->
  <g>
    <path d="M104 366c8-18-2-26 0-38 10 8 16 20 16 34" fill="none" stroke="#ff7a1a" stroke-width="6" stroke-linecap="round"/>
    <circle cx="110" cy="390" r="21" fill="url(#coin)" stroke="#8a3b13" stroke-width="5"/>
    <path d="M110 379v22M104 385h8a4.5 4.5 0 0 1 0 9h-5" fill="none" stroke="#8a3b13" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- mirror line -->
  <rect x="64" y="306" width="384" height="18" rx="9" fill="#fff8e9" opacity=".68"/>
  <rect x="64" y="306" width="384" height="18" rx="9" fill="none" stroke="#8a3b13" stroke-width="4" opacity=".35"/>

  <!-- beautiful house -->
  <g>
    <rect x="318" y="92" width="40" height="58" rx="9" fill="#b85d24"/>
    <path d="M104 178 256 78 408 178 372 178 256 108 140 178Z" fill="url(#roof)" stroke="#8a3b13" stroke-width="9" stroke-linejoin="round"/>
    <rect x="150" y="168" width="212" height="112" rx="24" fill="url(#wall)" stroke="#8a3b13" stroke-width="9"/>
    <rect x="232" y="230" width="48" height="50" rx="11" fill="#8a3b13"/>
    <circle cx="272" cy="256" r="4" fill="#ffd9a4"/>
    <ellipse cx="228" cy="202" rx="8" ry="11" fill="#20100b"/>
    <ellipse cx="284" cy="202" rx="8" ry="11" fill="#20100b"/>
    <circle cx="231" cy="198" r="3" fill="#fff"/>
    <circle cx="287" cy="198" r="3" fill="#fff"/>
    <path d="M238 216c8 9 28 9 36 0" fill="none" stroke="#20100b" stroke-width="7" stroke-linecap="round"/>
    <ellipse cx="210" cy="218" rx="12" ry="7" fill="#ff9d8a" opacity=".85"/>
    <ellipse cx="302" cy="218" rx="12" ry="7" fill="#ff9d8a" opacity=".85"/>
    <path d="M170 252h28M314 252h28" stroke="#76c7e6" stroke-width="14" stroke-linecap="round"/>
  </g>

  <g fill="none" stroke="#fff8e9" stroke-width="8" stroke-linecap="round" opacity=".8">
    <path d="M82 126c0-20 14-26 14-46"/>
    <path d="M108 118c0-14 10-20 10-36"/>
  </g>
</svg>
