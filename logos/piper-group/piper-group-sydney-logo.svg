<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="circleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF9A3D"/>
      <stop offset="1" stop-color="#E85D04"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="#FFFFFF"/>

  <!-- ===================== EMBLEM ===================== -->
  <g>
    <!-- Orange badge circle -->
    <circle cx="430" cy="440" r="270" fill="url(#circleGrad)"/>
    <circle cx="430" cy="440" r="270" fill="none" stroke="#C44A00" stroke-width="4" opacity="0.35"/>

    <!-- Sydney Opera House sails (white) -->
    <g fill="#FFFFFF">
      <!-- left small -->
      <path d="M250 552 Q275 452 275 475 Q275 452 300 552 Z"/>
      <!-- left mid -->
      <path d="M312 552 Q347 374 347 415 Q347 374 382 552 Z"/>
      <!-- center tall -->
      <path d="M395 552 Q430 289 430 350 Q430 289 465 552 Z"/>
      <!-- right mid -->
      <path d="M478 552 Q513 374 513 415 Q513 374 548 552 Z"/>
      <!-- right small -->
      <path d="M560 552 Q585 452 585 475 Q585 452 610 552 Z"/>
    </g>

    <!-- ===== Bagpiper (dark silhouette) ===== -->
    <g fill="#6B2A08">
      <!-- drones (3 pipes over left shoulder) -->
      <rect x="379" y="386" width="6" height="86" rx="3"/>
      <rect x="390" y="380" width="6" height="92" rx="3"/>
      <rect x="401" y="386" width="6" height="86" rx="3"/>
      <!-- drone caps -->
      <rect x="378" y="380" width="8" height="8" rx="2" fill="#FFB27A"/>
      <rect x="389" y="374" width="8" height="8" rx="2" fill="#FFB27A"/>
      <rect x="400" y="380" width="8" height="8" rx="2" fill="#FFB27A"/>

      <!-- legs / kilt -->
      <path d="M402 520 L458 520 L466 604 Q430 616 396 604 Z"/>
      <!-- torso -->
      <path d="M396 456 Q430 448 464 456 L458 522 Q430 530 402 522 Z"/>
      <!-- head -->
      <circle cx="430" cy="432" r="22"/>
      <!-- glengarry cap -->
      <rect x="404" y="398" width="52" height="20" rx="8"/>
      <rect x="452" y="404" width="16" height="6" rx="3"/>
      <rect x="452" y="412" width="16" height="6" rx="3"/>
    </g>

    <!-- tartan sash (cream) -->
    <path d="M398 468 L462 496 L458 512 L394 484 Z" fill="#FFE3C8"/>

    <!-- bagpipe bag -->
    <ellipse cx="398" cy="486" rx="32" ry="22" fill="#FFB27A"/>
    <!-- chanter -->
    <path d="M410 502 L417 502 L431 556 L424 556 Z" fill="#FFB27A"/>
  </g>

  <!-- ===================== WORDMARK ===================== -->
  <g text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900">
    <text x="1160" y="440" font-size="170" letter-spacing="4" fill="#2A1608">PIPER</text>
    <text x="1160" y="600" font-size="170" letter-spacing="4" fill="#E85D04">GROUP</text>
    <text x="1160" y="672" font-size="46" letter-spacing="20" fill="#8A5A34" font-weight="600">SYDNEY</text>
  </g>
</svg>
