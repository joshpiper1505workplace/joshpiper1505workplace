<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="AI sparkle icon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="0.5" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="0.55" stop-color="#a5f3fc" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- rounded-square badge -->
  <rect x="20" y="20" width="472" height="472" rx="116" fill="url(#bg)"/>
  <rect x="20" y="20" width="472" height="472" rx="116" fill="url(#glow)"/>
  <rect x="26" y="26" width="460" height="460" rx="110" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="4"/>

  <!-- faint neural dots -->
  <g fill="#ffffff">
    <circle cx="120" cy="180" r="4" fill-opacity="0.28"/>
    <circle cx="398" cy="342" r="5" fill-opacity="0.22"/>
    <circle cx="206" cy="118" r="3" fill-opacity="0.22"/>
    <circle cx="330" cy="422" r="4" fill-opacity="0.20"/>
    <circle cx="118" cy="424" r="3" fill-opacity="0.20"/>
    <circle cx="424" cy="224" r="3" fill-opacity="0.26"/>
  </g>

  <!-- main AI sparkle -->
  <path filter="url(#soft)" fill="#ffffff" d="M256 124 C267 211 301 245 388 256 C301 267 267 301 256 388 C245 301 211 267 124 256 C211 245 245 211 256 124 Z"/>

  <!-- companion sparkles -->
  <path fill="#e0f2fe" fill-opacity="0.95" d="M372 116 C376 145 387 156 416 160 C387 164 376 175 372 204 C368 175 357 164 328 160 C357 156 368 145 372 116 Z"/>
  <path fill="#e0f2fe" fill-opacity="0.8" d="M172 328 C174 346 180 352 200 356 C180 360 174 366 172 384 C170 366 164 360 144 356 C164 352 170 346 172 328 Z"/>
</svg>
